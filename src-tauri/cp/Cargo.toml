[package]
name = "micontrol-facecp"
version = "0.1.0"
edition = "2021"

[lib]
name = "micontrol_facecp"
crate-type = ["cdylib"]

[dependencies]
windows = { version = "0.58", features = [
  "implement",
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_Pipes",
  "Win32_System_Memory",
  "Win32_System_SystemServices",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Security_Authentication_Identity",
  "Win32_Security_Credentials",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
] }
windows-core = "0.62"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fern = "0.7"
