[workspace]
members = ["cp"]
resolver = "2"

[package]
name = "micontrol"
version = "0.1.25"
edition = "2021"
default-run = "micontrol"

[lib]
name = "micontrol_lib"
# rlib only: the app binaries (micontrol, bridge, ecram_service, face_svc) link
# the lib statically via rlib; the Credential Provider is its own cdylib crate
# (`cp/`). staticlib+cdylib would triple the release codegen of this huge crate
# and thrash the 7 GB CI runner (each extra crate-type = another full codegen
# + link pass of ~all generic code).
crate-type = ["rlib"]

[[bin]]
name = "micontrol"
path = "src/main.rs"

[[bin]]
name = "ecram_service"
path = "src/bin/ecram_service.rs"

[[bin]]
name = "micontrol_bridge"
path = "src/bin/micontrol_bridge.rs"

[[bin]]
name = "micontrol_face_svc"
path = "src/bin/micontrol_face_svc.rs"
required-features = ["face"]

[features]
default = []
diag = []
# Enable the face-unlock auth service + camera pipeline. Uses onnxruntime
# (ort) + windows-service — no C++ toolchain required. OpenCV is optional
# and only pulled in via the `face-opencv` feature (requires libclang).
face = ["dep:windows-service"]
# Camera backend uses nokhwa (pure-Rust Media Foundation) — no C++/libclang.
face-opencv = ["face"]

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico"] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-mcp-bridge = "0.12"
# P3GLEG tauri-plugin-mcp — dev-only MCP server that lets AI agents inspect
# & drive the app (screenshots, DOM, input simulation, IPC, logs). Kept behind
# a git dependency per official docs (not yet on crates.io). Registered only in
# debug builds (see lib.rs).
tauri-plugin-mcp = { git = "https://github.com/P3GLEG/tauri-plugin-mcp" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net", "process"] }
anyhow = "1"
log = "0.4"
fern = "0.7"
humantime = "2.4"
thiserror = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
fs2 = "0.4"
libloading = "0.8"
keyring = { version = "3", features = ["windows-native"] }
reqwest = { version = "0.12", features = ["json", "stream", "gzip", "rustls-tls"] }
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
sentry = "0.34"
url = "2"
rayon = "1.10"
aes-gcm = "0.10"
zip = "2"
hkdf = "0.12"

# ── Face unlock (Windows Hello-style) ────────────────────────────────────────
# onnxruntime for face detection + recognition models.
ort = { version = "2.0.0-rc.13", features = ["download-binaries", "tls-native", "std", "ndarray"], default-features = false }
# Pure-Rust webcam capture (Media Foundation on Windows) — no C++/libclang.
nokhwa = { version = "0.10.11", features = ["input-msmf"], default-features = false }
windows-service = { version = "0.7", optional = true }
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_System_Registry",
  "Win32_Foundation",
  "Win32_Devices_HumanInterfaceDevice",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Com",
  "Win32_System_Wmi",
  "Win32_System_WindowsProgramming",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_System_Com_StructuredStorage",
  "Win32_Devices_PortableDevices",
  "Win32_System_Services",
  "Win32_System_Threading",
  "Win32_System_Pipes",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Memory",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_Input",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Power",
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_System_LibraryLoader",
  "Win32_Graphics_Gdi",
  "Win32_Devices_Display",
  "Devices_Sensors",
  "Win32_Devices_Sensors",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_NetworkManagement_WiFi",
  "Media_Casting",
  "Devices_Enumeration",
  "Foundation",
  "Foundation_Collections",
  "Win32_System_Diagnostics",
  "Win32_System_Recovery",
  "Win32_System_ErrorReporting",
  "Win32_Security_Credentials",
  "Win32_Security_Authentication_Identity",
  "Win32_Security_Cryptography",
  "Win32_System_SystemInformation",
  "Win32_UI_Shell_Common",
  "Win32_System_WinRT",
  "Win32_System_RemoteDesktop",
  "Win32_System_Diagnostics_ToolHelp",
  "Security_Credentials",
  "Security_Credentials_UI",
] }
windows-core = "0.58"
windows-targets = "0.52"
wmi = "0.13"
winreg = "0.52"

[lints.clippy]
all = { level = "deny", priority = -1 }
# Allow some opinionated lints that are not actionable
needless_pass_by_value = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_const_for_fn = "allow"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
# Use "unwind" instead of "abort" so panics are recoverable.
# A poisoned mutex (from a panic while holding the lock) can be recovered
# via lock_or_recover() instead of killing the entire process.
panic = "unwind"
# CI time/memory diagnosis (v0.1.18, runs 32139723515 / 32157591952):
#   - fat LTO (cgu=1), thin LTO (cgu=16) AND lto=false all stalled ~1h49m
#     with zero output after the last `Compiling` at the SAME point. Logs
#     prove the ~550-crate dep tree compiles in <5 min; the stall was the
#     ROOT crate codegen: high cgu × many parallel rustc on a 2-vCPU / 7 GB
#     runner = memory thrash (all three profiles spent identical 1h49m).
#   - The previous fix (codegen-units=1, lto=false) removed the thrash but
#     serialized codegen → cold compile jumped from ~30-40min (v0.1.8-0.1.13)
#     to hours, and CI still occasionally hung at `humantime` because a
#     single-thread codegen + 2-vCPU runner starves progress checks.
#   - Balanced profile (fastest that stays stable): codegen-units=8 restores
#     multi-threaded codegen (8 LLVM threads per rustc) while keeping the
#     per-process memory peak ~half of the default 16 + thin LTO gives a
#     parallel multi-threaded link without fat-LTO's memory blowup. The
#     standalone warm-cache workflow (warm-cache.yml, -j 2) then completes
#     the cold compile in ~40-90min and saves the shared release cache, so
#     every subsequent CI/release run restores it and finishes in minutes.
#   - opt-level = 2: ONNX inference runs in the prebuilt native `ort` runtime,
#     so Rust-side optimization loss is negligible for this utility app.
codegen-units = 8
lto = "thin"
opt-level = 2
strip = true
