name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  quality:
    name: Quality checks
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          components: clippy, rustfmt

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        shell: pwsh
        run: |
          $attempts = 3
          $last = 1
          for ($i = 1; $i -le $attempts; $i++) {
            Write-Host "pnpm install attempt $i/$attempts"
            pnpm install --frozen-lockfile
            $last = $LASTEXITCODE
            if ($last -eq 0) { break }
            if ($i -lt $attempts) { Start-Sleep -Seconds 15 }
          }
          exit $last

      # Exactly the same checks as the local health check (single source of
      # truth: scripts/health-check.mjs — no drift allowed between local & CI).
      - name: Health check (static)
        shell: pwsh
        run: node scripts/health-check.mjs --step=version,fmt,clippy,tsc,lint,format,i18n,toolchain

  test:
    name: Tests + coverage
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          components: clippy, rustfmt

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        shell: pwsh
        run: |
          $attempts = 3
          $last = 1
          for ($i = 1; $i -le $attempts; $i++) {
            Write-Host "pnpm install attempt $i/$attempts"
            pnpm install --frozen-lockfile
            $last = $LASTEXITCODE
            if ($last -eq 0) { break }
            if ($i -lt $attempts) { Start-Sleep -Seconds 15 }
          }
          exit $last

      # Same script as the local health check; split across jobs for
      # parallelism (slow Rust tests + coverage live here).
      - name: Health check (tests)
        shell: pwsh
        run: node scripts/health-check.mjs --step=test-rust,test-front

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            coverage/
          retention-days: 7

  build:
    name: Build smoke test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          components: clippy, rustfmt

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        shell: pwsh
        run: |
          $attempts = 3
          $last = 1
          for ($i = 1; $i -le $attempts; $i++) {
            Write-Host "pnpm install attempt $i/$attempts"
            pnpm install --frozen-lockfile
            $last = $LASTEXITCODE
            if ($last -eq 0) { break }
            if ($i -lt $attempts) { Start-Sleep -Seconds 15 }
          }
          exit $last

      - name: Frontend build
        run: pnpm run build

      # Bundle/signing happens in release.yml (has TAURI_SIGNING_PRIVATE_KEY
      # secrets). Here we only smoke-test compilation; --no-bundle keeps fork
      # PRs working since they cannot access repository secrets.
      - name: Tauri compile smoke test
        run: pnpm run tauri build --no-bundle
