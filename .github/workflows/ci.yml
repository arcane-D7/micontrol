name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  quality:
    name: Quality checks
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          components: clippy, rustfmt

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        shell: pwsh
        run: |
          $attempts = 3
          $last = 1
          for ($i = 1; $i -le $attempts; $i++) {
            Write-Host "pnpm install attempt $i/$attempts"
            pnpm install --frozen-lockfile
            $last = $LASTEXITCODE
            if ($last -eq 0) { break }
            if ($i -lt $attempts) { Start-Sleep -Seconds 15 }
          }
          exit $last

      - name: Cache Rust build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-rust-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ hashFiles('src-tauri/**/*.rs', 'src-tauri/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-rust-${{ hashFiles('src-tauri/Cargo.lock') }}-
            ${{ runner.os }}-rust-

      # Exactly the same checks as the local health check (single source of
      # truth: scripts/health-check.mjs — no drift allowed between local & CI).
      - name: Health check (static)
        shell: pwsh
        run: node scripts/health-check.mjs --step=version,fmt,clippy,tsc,lint,format,i18n,toolchain

  test:
    name: Tests + coverage
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          components: clippy, rustfmt

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        shell: pwsh
        run: |
          $attempts = 3
          $last = 1
          for ($i = 1; $i -le $attempts; $i++) {
            Write-Host "pnpm install attempt $i/$attempts"
            pnpm install --frozen-lockfile
            $last = $LASTEXITCODE
            if ($last -eq 0) { break }
            if ($i -lt $attempts) { Start-Sleep -Seconds 15 }
          }
          exit $last

      - name: Cache Rust build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-rust-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ hashFiles('src-tauri/**/*.rs', 'src-tauri/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-rust-${{ hashFiles('src-tauri/Cargo.lock') }}-
            ${{ runner.os }}-rust-

      # Same script as the local health check; split across jobs for
      # parallelism (slow Rust tests + coverage live here).
      - name: Health check (tests)
        shell: pwsh
        run: node scripts/health-check.mjs --step=test-rust,test-front

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: |
            coverage/
          retention-days: 7
# S70: the 'Build smoke test' job was REMOVED. It cold-compiled the full
# release profile (~500 crates) on a 2-vCPU runner — 2-4 h per run, and the
# release cache never survived (separate runner per job, cache save raced the
# timeout). It was also redundant: the quality job's clippy step already
# compiles the ENTIRE workspace (same code, debug profile) — if it compiles,
# release compiles. Real release builds are ALWAYS produced locally (see
# release-process.md: CI cannot link this crate within any sane budget since
# v0.1.18) and validated by the 12-gate health-check before publishing.
# warm-cache.yml (which existed only to feed this job's cache) is disabled.
