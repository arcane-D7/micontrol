name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Weekly warm-cache refresh. Without it the Build smoke test is a ~4h
  # cold release compile that always dies on the 240min timeout (the kill
  # skips the cache post-step, so the cold cost is paid on EVERY push —
  # a death loop). This job runs `cargo build --release` to completion once
  # a week; its post-step saves the warm release cache so the regular smoke
  # test restores it and finishes in minutes.
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      warm_cache:
        description: 'Also run the Warm release cache job (slow full release compile)'
        type: choice
        default: 'true'
        options: ['true', 'false']

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  quality:
    name: Quality checks
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          components: clippy, rustfmt

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        shell: pwsh
        run: |
          $attempts = 3
          $last = 1
          for ($i = 1; $i -le $attempts; $i++) {
            Write-Host "pnpm install attempt $i/$attempts"
            pnpm install --frozen-lockfile
            $last = $LASTEXITCODE
            if ($last -eq 0) { break }
            if ($i -lt $attempts) { Start-Sleep -Seconds 15 }
          }
          exit $last

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-rust-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ hashFiles('src-tauri/**/*.rs', 'src-tauri/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-rust-${{ hashFiles('src-tauri/Cargo.lock') }}-
            ${{ runner.os }}-rust-

      # Exactly the same checks as the local health check (single source of
      # truth: scripts/health-check.mjs — no drift allowed between local & CI).
      - name: Health check (static)
        shell: pwsh
        run: node scripts/health-check.mjs --step=version,fmt,clippy,tsc,lint,format,i18n,toolchain

  test:
    name: Tests + coverage
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          components: clippy, rustfmt

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        shell: pwsh
        run: |
          $attempts = 3
          $last = 1
          for ($i = 1; $i -le $attempts; $i++) {
            Write-Host "pnpm install attempt $i/$attempts"
            pnpm install --frozen-lockfile
            $last = $LASTEXITCODE
            if ($last -eq 0) { break }
            if ($i -lt $attempts) { Start-Sleep -Seconds 15 }
          }
          exit $last

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-rust-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ hashFiles('src-tauri/**/*.rs', 'src-tauri/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-rust-${{ hashFiles('src-tauri/Cargo.lock') }}-
            ${{ runner.os }}-rust-

      # Same script as the local health check; split across jobs for
      # parallelism (slow Rust tests + coverage live here).
      - name: Health check (tests)
        shell: pwsh
        run: node scripts/health-check.mjs --step=test-rust,test-front

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            coverage/
          retention-days: 7

  build:
    name: Build smoke test
    # Only gates pushes and PRs. On schedule/dispatch the `warm-cache` job
    # already performs the exact same release compile, so running this too
    # would burn a second 2-vCPU runner on a duplicated cold compile (no
    # incremental benefit — separate runners, separate target dirs).
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: windows-latest
    # The Tauri smoke build compiles the full Rust release profile
    # (codegen-units=1, opt-level=2) on a 2-vCPU runner. On the FIRST run
    # (cache-founding) that can take up to ~4h, so keep the timeout well
    # above the cold-compile cost; subsequent runs restore the release
    # cache (warmed weekly by the `warm-cache` job) and complete in
    # minutes. 300min also guarantees the cache post-step runs before any
    # timeout fires (a killed job skips the save — death loop).
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          components: clippy, rustfmt

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        shell: pwsh
        run: |
          $attempts = 3
          $last = 1
          for ($i = 1; $i -le $attempts; $i++) {
            Write-Host "pnpm install attempt $i/$attempts"
            pnpm install --frozen-lockfile
            $last = $LASTEXITCODE
            if ($last -eq 0) { break }
            if ($i -lt $attempts) { Start-Sleep -Seconds 15 }
          }
          exit $last

      # This job ONLY needs the release profile (the smoke build is
      # `tauri build`, i.e. cargo release). Using the dedicated release
      # cache means the debug artifacts cached by the `test` job never
      # pollute/restore here, and vice-versa. `save-always: true` is
      # critical: even if the smoke test is cancelled or fails at the very
      # end, the compiled release artifacts from THIS run are saved for the
      # next run (otherwise every cancelled build would restart the cold
      # compile forever — exactly the loop we observed).
      - name: Cache Rust release build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target/release
          key: ${{ runner.os }}-rust-release-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ hashFiles('src-tauri/**/*.rs', 'src-tauri/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-rust-release-${{ hashFiles('src-tauri/Cargo.lock') }}-
            ${{ runner.os }}-rust-release-
          save-always: true

      # The smoke test is intentionally a `cargo build --release` (no Tauri
      # bundling, no code signing) — bundling/signing only matter in
      # release.yml. `-j 2` keeps the 2-vCPU runner alive without OOM or
      # idle-silence (see the `warm-cache` job below for how the release
      # cache stays hot so this completes in minutes). The workspace
      # Cargo.toml lives under src-tauri/, so pass --manifest-path.
      #
      # IMPORTANT — parity with release.yml: same Rust feature set (the
      # front-end is compiled by beforeBuildCommand in `tauri build`; the
      # Rust compile below exercises exactly the same `-f face` code paths).
      - name: Rust release compile smoke test
        run: cargo build --manifest-path src-tauri/Cargo.toml --release --features face -j 2

  # Weekly warm-cache refresh (also triggered on demand via workflow_dispatch
  # or by any push with the `warm-cache` marker in the commit subject).
  # Purpose: the FIRST release compile on the shared `windows-latest`
  # 2-vCPU runner takes up to ~4h (550+ crates, codegen-units=1, opt-level=2)
  # and the 240min job timeout KILLS it mid-flight — and a killed job skips
  # the actions/cache post-step, so `save-always: true` never saves. Net
  # effect: every push pays the full cold compile and dies → death loop.
  # This job lets the compile run to COMPLETION (triggered weekly), then the
  # normal post-step saves the release cache. Once the cache exists, the
  # Build smoke test in this file (and release.yml's build-and-publish)
  # restore it and finish in minutes instead of hours.
  warm-cache:
    name: Warm release cache (weekly)
    # Runs on schedule or dispatch (with warm_cache=true). NEVER in the same
    # concurrency group as the rest: pushes/PRs would cancel it mid-compile
    # (and a cancelled job skips the cache post-step = cache never saved).
    # Group `warm-cache-main` + cancel-in-progress:false guarantees the
    # weekly compile runs to completion even if new pushes arrive.
    concurrency:
      group: warm-cache-${{ github.ref }}
      cancel-in-progress: false
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.warm_cache == 'true')
    runs-on: windows-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          components: clippy, rustfmt

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        shell: pwsh
        run: |
          $attempts = 3
          $last = 1
          for ($i = 1; $i -le $attempts; $i++) {
            Write-Host "pnpm install attempt $i/$attempts"
            pnpm install --frozen-lockfile
            $last = $LASTEXITCODE
            if ($last -eq 0) { break }
            if ($i -lt $attempts) { Start-Sleep -Seconds 15 }
          }
          exit $last

      # Same release cache (identical key shape) as the Build smoke test and
      # release.yml — so the weekly run warms what all release compiles use.
      # save-always: true guarantees the full compile output is persisted
      # even if this job is later cancelled mid-post-step.
      - name: Cache Rust release build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target/release
          key: ${{ runner.os }}-rust-release-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ hashFiles('src-tauri/**/*.rs', 'src-tauri/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-rust-release-${{ hashFiles('src-tauri/Cargo.lock') }}-
            ${{ runner.os }}-rust-release-
          save-always: true

      # Full release compile to COMPLETION. `-j 2` caps parallelism for the
      # 2-vCPU runner (matches the smoke test, avoids OOM/swap stalls).
      # --manifest-path because the workspace Cargo.toml is under src-tauri/.
      - name: Compile release (warm cache)
        run: cargo build --manifest-path src-tauri/Cargo.toml --release --features face -j 2
