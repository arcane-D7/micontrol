name: Release verify

# ARCHITECTURE (2026-11): releases are BUILT AND PUBLISHED LOCALLY with
# `scripts/publish-release.ps1` - signed NSIS installer + minisign `.sig` +
# `latest.json`. CI cannot link this crate within any sane budget on a 2-vCPU
# runner (every tag run since v0.2.16 hit that wall and had to be cancelled),
# so this workflow no longer builds: it VERIFIES that the release a tag points
# at contains the contract artefacts, that `latest.json` matches the tag, and
# that the minisign signature is present and well-formed. A broken manual
# release fails here within a minute.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to verify (e.g. v0.2.22)'
        required: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify published release
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Resolve tag
        id: ref
        shell: pwsh
        run: |
          $tag = if ("${{ inputs.tag }}" -ne "") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($tag -replace '^v','')" >> $env:GITHUB_OUTPUT

      - name: Verify release contract
        shell: pwsh
        run: |
          $tag = "${{ steps.ref.outputs.tag }}"
          $version = "${{ steps.ref.outputs.version }}"
          $repo = "${{ github.repository }}"
          Write-Host "verifying $repo release $tag (version $version)"

          $release = gh api "repos/$repo/releases/tags/$tag" | ConvertFrom-Json
          if ($null -eq $release) { throw "release $tag not found" }
          if ($release.draft) { throw "release $tag is still a DRAFT" }
          $names = @($release.assets | ForEach-Object { $_.name })
          Write-Host ("assets: " + ($names -join ', '))

          $installer = "MiControl_${version}_x64-setup.exe"
          foreach ($needle in @($installer, "$installer.sig", 'latest.json')) {
            if ($names -notcontains $needle) { throw "asset missing: $needle" }
          }

          # latest.json must target the same version and an asset that exists.
          $manifestUrl = ($release.assets | Where-Object { $_.name -eq 'latest.json' }).browser_download_url
          $manifest = Invoke-RestMethod -Uri $manifestUrl -Headers @{ 'User-Agent' = 'micontrol-ci' }
          if ($manifest.version -ne $version) {
            throw "latest.json version '$($manifest.version)' != tag version '$version'"
          }
          $platform = $manifest.platforms.'windows-x86_64'
          if ($null -eq $platform) { throw "latest.json has no windows-x86_64 platform entry" }
          $sig = [string]$platform.signature
          if ([string]::IsNullOrWhiteSpace($sig)) { throw "latest.json signature is empty" }
          $decoded = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($sig))
          if (-not $decoded.StartsWith('untrusted comment: signature')) {
            throw "latest.json signature is not a minisign signature"
          }
          $targetName = [IO.Path]::GetFileName(([Uri]$platform.url).AbsolutePath)
          if ($names -notcontains $targetName) {
            throw "latest.json points at '$targetName' which is not a release asset"
          }

          # The published .sig file must be a well-formed minisign signature too.
          $sigUrl = ($release.assets | Where-Object { $_.name -eq "$installer.sig" }).browser_download_url
          $sigText = (Invoke-WebRequest -Uri $sigUrl -UseBasicParsing).Content
          $sigDecoded = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(([string]$sigText).Trim()))
          if (-not $sigDecoded.StartsWith('untrusted comment: signature')) {
            throw "$installer.sig is not a minisign signature"
          }

          Write-Host "OK: $tag - installer + .sig + latest.json consistent"
