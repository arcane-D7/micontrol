name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.4)'
        required: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

# Only one release build at a time. A new tag push (or re-push of the same tag)
# cancels a still-running build instead of starting a second one and doubling
# the 2-hour budget on parallel Windows runners.
concurrency:
  group: release-build
  cancel-in-progress: true

jobs:
  health-check:
    name: Health checks
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          components: clippy, rustfmt

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        shell: pwsh
        run: |
          $attempts = 3
          $last = 1
          for ($i = 1; $i -le $attempts; $i++) {
            Write-Host "pnpm install attempt $i/$attempts"
            pnpm install --frozen-lockfile
            $last = $LASTEXITCODE
            if ($last -eq 0) { break }
            if ($i -lt $attempts) { Start-Sleep -Seconds 15 }
          }
          exit $last

      # Identical to the local health check (single source of truth).
      - name: Health check
        shell: pwsh
        run: node scripts/health-check.mjs

  build-and-publish:
    name: Build & publish
    runs-on: windows-latest
    needs: health-check
    # The release compile (codegen-units=1, opt-level=2) on a 2-vCPU runner
    # takes up to ~3.5h on a cold cache. 300min covers the cache-founding
    # run AND guarantees the post-step (which saves the release cache)
    # executes before any timeout fires; later runs restore the release
    # cache (warmed weekly by ci.yml's warm-cache job) and finish in
    # minutes (same reasoning as ci.yml's Build smoke test).
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          components: clippy, rustfmt

      # Same release-profile cache as ci.yml (identical key shape so both
      # workflows share warm artifacts). `save-always: true` ensures a
      # cancelled/failed publish still saves what it compiled.
      - name: Cache Rust release build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target/release
          # S70 (CI cache fix): key on Cargo.lock only — hashing all .rs
          # sources guaranteed a cache miss on every Rust commit (2-4 h cold
          # compiles on the 2-vCPU runner). cargo reuses a restored target
          # dir incrementally; see ci.yml for the full rationale.
          key: ${{ runner.os }}-rust-release-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-release-
            ${{ runner.os }}-rust-release-
          save-always: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        shell: pwsh
        run: |
          $attempts = 3
          $last = 1
          for ($i = 1; $i -le $attempts; $i++) {
            Write-Host "pnpm install attempt $i/$attempts"
            pnpm install --frozen-lockfile
            $last = $LASTEXITCODE
            if ($last -eq 0) { break }
            if ($i -lt $attempts) { Start-Sleep -Seconds 15 }
          }
          exit $last

      - name: Build Tauri app
        run: pnpm run tauri build -f face
        env:
          # Same job parallelism as ci.yml's smoke test / warm-cache job so
          # the compile characteristics (memory pressure, artifact layout)
          # match exactly — builds stay environment-agnostic.
          CARGO_BUILD_JOBS: '2'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Build static setup shell
        shell: pwsh
        run: |
          # S65-003 AC3: CI builds the SAME static shell artifact as the local
          # release path (cargo build -p micontrol-setup --profile shell-release)
          # and verifies its expected signing state.
          cargo build -p micontrol-setup --profile shell-release --manifest-path src-tauri/Cargo.toml
          $shell = "src-tauri/target/release/shell-release/micontrol_setup.exe"
          if (-not (Test-Path $shell)) { throw "shell binary not found: $shell" }
          $size = (Get-Item $shell).Length
          if ($size -lt 500000 -or $size -gt (16 * 1024 * 1024)) {
            throw "shell size out of bounds: $size bytes (expected 500000..16777216)"
          }
          Write-Host "shell size OK: $size bytes"
          Write-Host "shell SHA256: $((Get-FileHash $shell -Algorithm SHA256).Hash)"
          # Expected signing state in CI: unsigned — Authenticode signing of the
          # shell is done locally (publish-release.ps1) with the code-signing
          # cert (never exposed to CI). Verify + report, do not fail.
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if ($null -eq $signtool) {
            Write-Host 'signing state: signtool unavailable (expected None in CI)'
          } else {
            & $signtool.FullName verify /pa /v $shell | Out-Null
            if ($LASTEXITCODE -eq 0) { Write-Host 'signing state: Authenticode VERIFIED' }
            else { Write-Host 'signing state: unsigned (expected for CI shell; local publisher signs with cert)' }
          }
          # Place the shell under bundle/ where the release asset glob picks it
          # up under its canonical name (single source of truth).
          $bundleDir = "src-tauri/target/release/bundle/nsis"
          New-Item -ItemType Directory -Force -Path $bundleDir | Out-Null
          Copy-Item $shell (Join-Path $bundleDir 'MiControl_Setup.exe') -Force

      - name: Build, sign decoupled payload and generate latest.json
        shell: pwsh
        run: |
          # S65-004 AC1/AC5 + S65-003 AC2: required signing credentials and
          # payload entries MUST be present — fail closed before publication.
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw 'TAURI_SIGNING_PRIVATE_KEY secret is not set — release aborted (S65-003/004 AC)'
          }
          $Version = "${{ github.ref_name }}" -replace '^v', ''
          $releaseDir = 'src-tauri/target/release'
          $bundleDir = "$releaseDir/bundle/nsis"
          $staging = Join-Path $env:RUNNER_TEMP "micontrol-payload-$Version"
          if (Test-Path $staging) { Remove-Item $staging -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $staging | Out-Null

          $required = @('micontrol.exe', 'ecram_service.exe', 'micontrol_bridge.exe')
          $missing = @()
          foreach ($f in $required) {
            $src = Join-Path $releaseDir $f
            if (Test-Path $src) { Copy-Item $src (Join-Path $staging $f) }
            else { $missing += $f }
          }
          if ($missing.Count -gt 0) {
            throw "FAIL-CLOSED: required payload entry(s) missing — $($missing -join ', '). Release aborted."
          }
          foreach ($o in @('micontrol_face_svc.exe', 'micontrol_facecp.dll', 'WebView2Loader.dll')) {
            $src = Join-Path $releaseDir $o
            if (Test-Path $src) { Copy-Item $src (Join-Path $staging $o) }
            else { Write-Warning "optional payload component absent: $o" }
          }
          foreach ($d in @('drivers', 'resources')) {
            $src = Join-Path $releaseDir $d
            if (Test-Path $src) { Copy-Item $src (Join-Path $staging $d) -Recurse }
            else { Write-Warning "optional payload component absent: $d" }
          }
          '{"version":"' + $Version + '","optional":["micontrol_face_svc.exe","micontrol_facecp.dll","WebView2Loader.dll","drivers","resources"]}' |
            Set-Content -Encoding UTF8 (Join-Path $staging 'payload.json')

          $payloadName = "MiControl_${Version}_payload.zip"
          $payloadZip = Join-Path $bundleDir $payloadName
          Compress-Archive -Path (Join-Path $staging '*') -DestinationPath $payloadZip -CompressionLevel Optimal
          Remove-Item $staging -Recurse -Force
          Write-Host "payload: $payloadZip ($((Get-Item $payloadZip).Length) bytes)"

          # Minisign-sign the PAYLOAD (the updater verifies this signature).
          pnpm exec tauri signer sign -k $env:TAURI_SIGNING_PRIVATE_KEY $payloadZip
          if ($LASTEXITCODE -ne 0) { throw 'tauri signer sign failed for the payload' }
          if (-not (Test-Path "$payloadZip.sig")) { throw 'payload signature not found after signing' }

          # latest.json → signed PAYLOAD zip. The NSIS installer is a manual
          # fallback and is NEVER the updater target (S65-003 AC2).
          $payloadUrl = "https://github.com/arcane-D7/micontrol/releases/latest/download/$payloadName"
          node scripts/generate-latest-json.mjs "$Version" "$payloadZip.sig" "$payloadUrl" "$bundleDir/latest.json"
          if ($LASTEXITCODE -ne 0) { throw 'generate-latest-json.mjs failed' }
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Offline dry-run release validation
        shell: pwsh
        run: |
          # S65-003 AC4 + S65-004 AC5: validate the staged asset set and updater
          # manifest WITHOUT calling gh release / pushing a tag. Any violation
          # (missing asset, wrong name, NSIS-targeted latest.json, bad/absent
          # signature) fails the job before publication.
          $Version = "${{ github.ref_name }}" -replace '^v', ''
          $bundleDir = 'src-tauri/target/release/bundle/nsis'
          $payloadZip = Join-Path $bundleDir "MiControl_${Version}_payload.zip"
          node scripts/release-contract.mjs dry-run $Version $payloadZip "$payloadZip.sig"
          if ($LASTEXITCODE -ne 0) { throw 'release-contract dry-run failed — release aborted' }
          node scripts/release-contract.mjs check $Version $bundleDir
          if ($LASTEXITCODE -ne 0) { throw 'release-contract check failed — release aborted' }
          Write-Host '✓ offline release validation passed'

      - name: Prepare release body from CHANGELOG
        shell: pwsh
        run: |
          $tagName = "${{ github.ref_name }}"
          $version = $tagName -replace '^v', ''
          node scripts/extract-changelog.mjs "$version" "$env:RUNNER_TEMP/release-body.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          body_path: ${{ runner.temp }}/release-body.md
          files: |
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.zip
            src-tauri/target/release/bundle/**/*.sig
            src-tauri/target/release/bundle/nsis/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
