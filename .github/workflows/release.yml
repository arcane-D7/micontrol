name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.4)'
        required: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

# Only one release build at a time. A new tag push (or re-push of the same tag)
# cancels a still-running build instead of starting a second one and doubling
# the 2-hour budget on parallel Windows runners.
concurrency:
  group: release-build
  cancel-in-progress: true

jobs:
  health-check:
    name: Health checks
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          components: clippy, rustfmt

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        shell: pwsh
        run: |
          $attempts = 3
          $last = 1
          for ($i = 1; $i -le $attempts; $i++) {
            Write-Host "pnpm install attempt $i/$attempts"
            pnpm install --frozen-lockfile
            $last = $LASTEXITCODE
            if ($last -eq 0) { break }
            if ($i -lt $attempts) { Start-Sleep -Seconds 15 }
          }
          exit $last

      # Identical to the local health check (single source of truth).
      - name: Health check
        shell: pwsh
        run: node scripts/health-check.mjs

  build-and-publish:
    name: Build & publish
    runs-on: windows-latest
    needs: health-check
    # The release compile (codegen-units=1, opt-level=2) on a 2-vCPU runner
    # takes up to ~3.5h on a cold cache. 300min covers the cache-founding
    # run AND guarantees the post-step (which saves the release cache)
    # executes before any timeout fires; later runs restore the release
    # cache (warmed weekly by ci.yml's warm-cache job) and finish in
    # minutes (same reasoning as ci.yml's Build smoke test).
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          components: clippy, rustfmt

      # Same release-profile cache as ci.yml (identical key shape so both
      # workflows share warm artifacts). `save-always: true` ensures a
      # cancelled/failed publish still saves what it compiled.
      - name: Cache Rust release build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target/release
          key: ${{ runner.os }}-rust-release-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ hashFiles('src-tauri/**/*.rs', 'src-tauri/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-rust-release-${{ hashFiles('src-tauri/Cargo.lock') }}-
            ${{ runner.os }}-rust-release-
          save-always: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        shell: pwsh
        run: |
          $attempts = 3
          $last = 1
          for ($i = 1; $i -le $attempts; $i++) {
            Write-Host "pnpm install attempt $i/$attempts"
            pnpm install --frozen-lockfile
            $last = $LASTEXITCODE
            if ($last -eq 0) { break }
            if ($i -lt $attempts) { Start-Sleep -Seconds 15 }
          }
          exit $last

      - name: Build Tauri app
        run: pnpm run tauri build -f face
        env:
          # Same job parallelism as ci.yml's smoke test / warm-cache job so
          # the compile characteristics (memory pressure, artifact layout)
          # match exactly — builds stay environment-agnostic.
          CARGO_BUILD_JOBS: '2'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Generate latest.json for updater
        shell: pwsh
        run: |
          $tagName = "${{ github.ref_name }}"
          $version = $tagName -replace '^v', ''
          $sigPath = "src-tauri/target/release/bundle/nsis/MiControl_$($version)_x64-setup.exe.sig"
          $installerName = "MiControl_$($version)_x64-setup.exe"
          $installerUrl = "https://github.com/arcane-D7/micontrol/releases/latest/download/$installerName"
          node scripts/generate-latest-json.mjs "$version" "$sigPath" "$installerUrl" "src-tauri/target/release/bundle/nsis/latest.json"

      - name: Prepare release body from CHANGELOG
        shell: pwsh
        run: |
          $tagName = "${{ github.ref_name }}"
          $version = $tagName -replace '^v', ''
          node scripts/extract-changelog.mjs "$version" "$env:RUNNER_TEMP/release-body.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          body_path: ${{ runner.temp }}/release-body.md
          files: |
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.zip
            src-tauri/target/release/bundle/**/*.sig
            src-tauri/target/release/bundle/nsis/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
