name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.4)'
        required: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  health-check:
    name: Health checks
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          components: clippy, rustfmt

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        shell: pwsh
        run: |
          $attempts = 3
          $last = 1
          for ($i = 1; $i -le $attempts; $i++) {
            Write-Host "pnpm install attempt $i/$attempts"
            pnpm install --frozen-lockfile
            $last = $LASTEXITCODE
            if ($last -eq 0) { break }
            if ($i -lt $attempts) { Start-Sleep -Seconds 15 }
          }
          exit $last

      # Identical to the local health check (single source of truth).
      - name: Health check
        shell: pwsh
        run: node scripts/health-check.mjs

  build-and-publish:
    name: Build & publish
    runs-on: windows-latest
    needs: health-check
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          components: clippy, rustfmt

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        shell: pwsh
        run: |
          $attempts = 3
          $last = 1
          for ($i = 1; $i -le $attempts; $i++) {
            Write-Host "pnpm install attempt $i/$attempts"
            pnpm install --frozen-lockfile
            $last = $LASTEXITCODE
            if ($last -eq 0) { break }
            if ($i -lt $attempts) { Start-Sleep -Seconds 15 }
          }
          exit $last

      - name: Build Tauri app
        run: pnpm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}


      - name: Generate latest.json for updater
        shell: pwsh
        run: |
          $tagName = "${{ github.ref_name }}"
          $version = $tagName -replace '^v', ''
          $sigPath = "src-tauri/target/release/bundle/nsis/MiControl_$($version)_x64-setup.exe.sig"
          $installerName = "MiControl_$($version)_x64-setup.exe"
          $installerUrl = "https://github.com/arcane-D7/micontrol/releases/latest/download/$installerName"
          node scripts/generate-latest-json.mjs "$version" "$sigPath" "$installerUrl" "src-tauri/target/release/bundle/nsis/latest.json"

      - name: Prepare release body from CHANGELOG
        shell: pwsh
        run: |
          $tagName = "${{ github.ref_name }}"
          $version = $tagName -replace '^v', ''
          node scripts/extract-changelog.mjs "$version" "$env:RUNNER_TEMP/release-body.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          body_path: ${{ runner.temp }}/release-body.md
          files: |
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.zip
            src-tauri/target/release/bundle/**/*.sig
            src-tauri/target/release/bundle/nsis/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
